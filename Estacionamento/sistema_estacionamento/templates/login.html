<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estacionamento</title>
    <link rel="stylesheet" type="text/css" href="../static/css/login.css">
</head>
<body>
    <main class="login-container">
        <h1>Estacionamento</h1>
        <p>Acesse sua conta</p>

       
                    <div class="mensagem {{ categoria }}">
                       
                    </div>
              

        <form method="POST" action="{{ url_for('login') }}">
            <!-- Token de proteção obrigatório contra CSRF -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="login">Usuário</label>
            <input id="login" name="login" type="text" placeholder="Digite seu usuário" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
